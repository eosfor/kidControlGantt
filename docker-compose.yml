services:
  web:
    build: .
    ports:
      - "3030:80"
    restart: unless-stopped
    volumes:
      - ./:/usr/share/nginx/html:ro

  proxy:
    build: ./proxy
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./proxy/config:/app/config:ro
      - proxy-data:/data

volumes:
  proxy-data:
