<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kid Control Access Manager</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --line: #dde4ef;
      --text: #1d2a3a;
      --muted: #5a6a80;
      --good: #1a8b4a;
      --warn: #b06800;
      --danger: #b02828;
      --primary: #1d5eff;
      --primary-hover: #1346c2;
      --disabled: #bcc6d6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: linear-gradient(145deg, #eef3ff 0%, #f7f9fd 55%, #eef7f1 100%);
      min-height: 100vh;
    }

    .container {
      max-width: 1280px;
      margin: 16px auto;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(17, 31, 60, 0.08);
    }

    h1 {
      margin: 0 0 12px 0;
      font-size: 1.4rem;
    }

    .meta {
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 0.95rem;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
      background: var(--primary);
      min-width: 130px;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:disabled {
      background: var(--disabled);
      cursor: not-allowed;
    }

    .btn-danger {
      background: var(--danger);
      min-width: 100px;
    }

    .btn-danger:hover {
      background: #8c2121;
    }

    .status {
      min-height: 24px;
      color: var(--muted);
      margin: 6px 0 12px;
    }

    .status.error {
      color: var(--danger);
      font-weight: 600;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
      background: #fff;
      table-layout: fixed;
    }

    th,
    td {
      text-align: left;
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
      vertical-align: middle;
      font-size: 14px;
    }

    th {
      background: #f0f4fb;
      color: #33435b;
      font-weight: 700;
      white-space: normal;
      line-height: 1.2;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .user {
      font-weight: 700;
    }

    .user-link {
      color: var(--primary);
      text-decoration: none;
      border-bottom: 1px dashed rgba(29, 94, 255, 0.4);
    }

    .user-link:hover {
      color: var(--primary-hover);
      border-bottom-color: rgba(19, 70, 194, 0.6);
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .ok {
      color: var(--good);
      font-weight: 700;
    }

    .warning {
      color: var(--warn);
      font-weight: 700;
    }

    .danger {
      color: var(--danger);
      font-weight: 700;
    }

    .window-control {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    input[type='number'] {
      width: 88px;
      border: 1px solid #bfcbe0;
      border-radius: 6px;
      padding: 6px;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    td[data-label="Пользователь"] {
      min-width: 170px;
    }

    .actions button {
      min-width: 0;
      padding: 8px 10px;
      font-size: 13px;
    }

    @media (max-width: 860px) {
      .container {
        margin: 8px;
        padding: 10px;
      }

      h1 {
        font-size: 1.15rem;
      }

      .toolbar button {
        width: 100%;
      }
    }

    @media (max-width: 1400px) {
      .container {
        max-width: none;
        margin: 8px;
        padding: 12px;
      }

      th,
      td {
        font-size: 13px;
        padding: 8px 6px;
      }

      .muted {
        font-size: 11px;
      }

      input[type='number'] {
        width: 72px;
        padding: 5px;
      }

      .window-control {
        gap: 6px;
      }

      .actions {
        flex-direction: column;
        gap: 6px;
      }

      .actions button {
        width: 100%;
      }
    }

    @media (max-width: 760px) {
      .table-wrap {
        overflow-x: visible;
        border: none;
      }

      table,
      thead,
      tbody,
      tr,
      td {
        display: block;
        width: 100%;
      }

      thead {
        display: none;
      }

      table {
        min-width: 0;
      }

      tr {
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 10px;
        padding: 4px 10px;
        background: #fff;
      }

      tr:last-child {
        margin-bottom: 0;
      }

      td {
        border-bottom: 1px dashed #d9e1ee;
        padding: 10px 0;
      }

      td:last-child {
        border-bottom: none;
      }

      td::before {
        content: attr(data-label);
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .window-control {
        justify-content: space-between;
      }

      .actions {
        flex-direction: column;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Управление доступом MikroTik Kid Control</h1>
    <div class="meta" id="meta"></div>

    <div class="toolbar">
      <button id="reloadBtn" type="button">Обновить</button>
      <span class="muted">Для активной сессии кнопка меняется на "Изменить текущую сессию".</span>
    </div>

    <div class="status" id="status"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Пользователь</th>
            <th>Лимит на сегодня</th>
            <th>Остаток до лимита</th>
            <th>Таймер текущего окна</th>
            <th>Размер окна (мин)</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script>
    let state = null;
    let syncTimestampMs = 0;
    let clientSyncAtMs = 0;
    let isStateFetchInFlight = false;
    let stateFetchSeq = 0;
    let latestAppliedStateFetchSeq = 0;
    const selectedWindows = {};
    const rowRefs = new Map();

    const rowsEl = document.getElementById('rows');
    const statusEl = document.getElementById('status');
    const metaEl = document.getElementById('meta');
    const reloadBtn = document.getElementById('reloadBtn');

    function setStatus(message, isError = false) {
      statusEl.textContent = message || '';
      statusEl.classList.toggle('error', Boolean(isError));
    }

    function fmtDuration(totalSeconds) {
      const sec = Math.max(0, Math.floor(totalSeconds));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function currentServerMs() {
      if (!syncTimestampMs || !clientSyncAtMs) {
        return Date.now();
      }
      const delta = Date.now() - clientSyncAtMs;
      return syncTimestampMs + delta;
    }

    function renderMeta() {
      if (!state) {
        metaEl.innerHTML = '';
        return;
      }
      metaEl.innerHTML = [
        `День: <strong>${state.dayLabel}</strong>`,
        `Таймзона: <strong>${state.timezone}</strong>`,
        `Окно доступа: <strong>${state.dayWindowStart}-${state.dayWindowEnd}</strong>`,
        `Авто-отключение: <strong>${state.dayWindowCutoff}</strong>`,
        `Окно по умолчанию: <strong>${state.defaultWindowMinutes} мин</strong>`,
        `Grace: <strong>${state.graceMinutes} мин</strong>`
      ].map((item) => `<span>${item}</span>`).join('');
    }

    function buildUserStatus(row) {
      if (!row.existsInMikrotik) {
        return { label: 'not-found', className: 'danger' };
      }

      const status = String(row.mikrotikStatus || 'unknown').toLowerCase();
      if (status.includes('disabled')) {
        return { label: status, className: 'danger' };
      }
      if (status.includes('blocked') || status.includes('paused')) {
        return { label: status, className: 'warning' };
      }
      if (status.includes('active')) {
        return { label: status, className: 'ok' };
      }

      return { label: status, className: 'muted' };
    }

    function getDynamicUsage(row, nowMs) {
      if (!row.activeSession) {
        return row.usedSeconds;
      }

      if (nowMs <= syncTimestampMs) {
        return row.usedSeconds;
      }

      const additional = Math.max(0, Math.min(nowMs, row.activeSession.endsAtMs) - syncTimestampMs);
      return row.usedSeconds + Math.floor(additional / 1000);
    }

    function canRequestNow(row, dynamicUsedSeconds, nowMs) {
      const dayLimitSeconds = row.dayLimitMinutes * 60;
      const extraUsedSeconds = Math.max(0, dynamicUsedSeconds - row.usedSeconds);
      const dynamicRemainingCapSeconds = Math.max(0, row.remainingCapSeconds - extraUsedSeconds);
      const inRequestWindow = (!state.dayWindowStartMs || nowMs >= state.dayWindowStartMs)
        && (!state.dayWindowEndMs || nowMs <= state.dayWindowEndMs);

      return row.existsInMikrotik
        && dynamicUsedSeconds < dayLimitSeconds
        && dynamicRemainingCapSeconds > 0
        && inRequestWindow;
    }

    function getRequestButtonLabel(row) {
      return row.activeSession ? 'Изменить текущую сессию' : 'Запросить доступ';
    }

    function shouldRebuildRows(nextState) {
      if (!state || !Array.isArray(state.users) || !Array.isArray(nextState.users)) {
        return true;
      }

      if (state.dayKey !== nextState.dayKey) {
        return true;
      }

      if (state.users.length !== nextState.users.length) {
        return true;
      }

      for (let i = 0; i < state.users.length; i += 1) {
        const prev = state.users[i];
        const next = nextState.users[i];
        if (prev.name !== next.name || prev.displayName !== next.displayName) {
          return true;
        }
      }

      return false;
    }

    function updateStaticRows() {
      if (!state || !Array.isArray(state.users) || state.users.length === 0) {
        return;
      }

      const nowMs = currentServerMs();

      for (const row of state.users) {
        const refs = rowRefs.get(row.name);
        if (!refs) {
          continue;
        }

        const dayLimitSeconds = row.dayLimitMinutes * 60;
        const dynamicUsedSeconds = getDynamicUsage(row, nowMs);
        const maxWindow = Math.max(0, row.dayLimitMinutes);

        let selectedWindow = Number(selectedWindows[row.name]);
        if (!Number.isFinite(selectedWindow)) {
          selectedWindow = row.suggestedWindowMinutes;
        }
        selectedWindow = Math.max(0, Math.min(maxWindow, Math.floor(selectedWindow)));
        selectedWindows[row.name] = selectedWindow;

        const userStatus = buildUserStatus(row);

        if (refs.dayLimitEl) {
          refs.dayLimitEl.textContent = fmtDuration(dayLimitSeconds);
        }

        if (refs.userStatusEl) {
          refs.userStatusEl.textContent = userStatus.label;
          refs.userStatusEl.className = userStatus.className;
        }

        if (refs.windowInputEl) {
          refs.windowInputEl.max = String(maxWindow);
          refs.windowInputEl.value = String(selectedWindow);
        }

        if (refs.windowRangeEl) {
          refs.windowRangeEl.textContent = `0..${maxWindow}`;
        }

        if (refs.requestBtn) {
          refs.requestBtn.disabled = !canRequestNow(row, dynamicUsedSeconds, nowMs);
          refs.requestBtn.textContent = getRequestButtonLabel(row);
        }
      }
    }

    function applyState(nextState, forceRebuildRows = false) {
      const rebuildRows = forceRebuildRows || shouldRebuildRows(nextState);
      state = nextState;
      syncTimestampMs = nextState.serverTimeMs;
      clientSyncAtMs = Date.now();
      renderMeta();

      if (rebuildRows) {
        renderRows();
      } else {
        updateStaticRows();
        updateLiveRows();
      }
    }

    function renderRows() {
      rowsEl.innerHTML = '';
      rowRefs.clear();

      if (!state || !Array.isArray(state.users) || state.users.length === 0) {
        rowsEl.innerHTML = '<tr><td colspan="6">В конфиге нет пользователей для отображения.</td></tr>';
        return;
      }

      const nowMs = currentServerMs();

      for (const row of state.users) {
        const tr = document.createElement('tr');
        const dayLimitSeconds = row.dayLimitMinutes * 60;
        const dynamicUsedSeconds = getDynamicUsage(row, nowMs);
        const remainingSeconds = Math.max(0, dayLimitSeconds - dynamicUsedSeconds);
        const windowRemaining = row.activeSession ? Math.max(0, Math.floor((row.activeSession.endsAtMs - nowMs) / 1000)) : 0;
        const userStatus = buildUserStatus(row);

        if (!(row.name in selectedWindows)) {
          selectedWindows[row.name] = row.suggestedWindowMinutes;
        }

        const maxWindow = Math.max(0, row.dayLimitMinutes);
        let selectedWindow = Number(selectedWindows[row.name]);
        if (!Number.isFinite(selectedWindow)) {
          selectedWindow = row.suggestedWindowMinutes;
        }
        selectedWindow = Math.max(0, Math.min(maxWindow, Math.floor(selectedWindow)));
        selectedWindows[row.name] = selectedWindow;

        const requestAvailable = canRequestNow(row, dynamicUsedSeconds, nowMs);

        tr.innerHTML = `
          <td data-label="Пользователь">
            <div class="user"><a class="user-link" href="/user-stats.html?user=${encodeURIComponent(row.name)}">${row.displayName}</a></div>
            <div class="muted">${row.name} | <span data-field="user-status" class="${userStatus.className}">${userStatus.label}</span></div>
          </td>
          <td data-label="Лимит на сегодня"><span data-field="day-limit">${fmtDuration(dayLimitSeconds)}</span></td>
          <td data-label="Остаток до лимита"><span data-field="remaining" class="${remainingSeconds === 0 ? 'danger' : 'ok'}">${fmtDuration(remainingSeconds)}</span></td>
          <td data-label="Таймер текущего окна"><span data-field="window-remaining" class="${windowRemaining === 0 ? 'muted' : 'warning'}">${fmtDuration(windowRemaining)}</span></td>
          <td data-label="Размер окна (мин)">
            <div class="window-control">
              <input
                type="number"
                min="0"
                max="${maxWindow}"
                step="1"
                value="${selectedWindow}"
                data-role="window"
                data-user="${row.name}"
              />
              <span class="muted" data-field="window-range">0..${maxWindow}</span>
            </div>
          </td>
          <td data-label="Действия">
            <div class="actions">
              <button type="button" data-role="request" data-field="request-btn" data-user="${row.name}" ${requestAvailable ? '' : 'disabled'}>${getRequestButtonLabel(row)}</button>
              <button type="button" class="btn-danger" data-role="disable" data-field="disable-btn" data-user="${row.name}" ${row.activeSession ? '' : 'disabled'}>Отключить</button>
            </div>
          </td>
        `;

        rowRefs.set(row.name, {
          dayLimitEl: tr.querySelector('[data-field="day-limit"]'),
          userStatusEl: tr.querySelector('[data-field="user-status"]'),
          remainingEl: tr.querySelector('[data-field="remaining"]'),
          windowRemainingEl: tr.querySelector('[data-field="window-remaining"]'),
          windowInputEl: tr.querySelector('[data-role="window"]'),
          windowRangeEl: tr.querySelector('[data-field="window-range"]'),
          requestBtn: tr.querySelector('[data-field="request-btn"]'),
          disableBtn: tr.querySelector('[data-field="disable-btn"]')
        });

        rowsEl.appendChild(tr);
      }
    }

    function updateLiveRows() {
      if (!state || !Array.isArray(state.users) || state.users.length === 0) {
        return;
      }

      const nowMs = currentServerMs();

      for (const row of state.users) {
        const refs = rowRefs.get(row.name);
        if (!refs) {
          continue;
        }

        const dayLimitSeconds = row.dayLimitMinutes * 60;
        const dynamicUsedSeconds = getDynamicUsage(row, nowMs);
        const remainingSeconds = Math.max(0, dayLimitSeconds - dynamicUsedSeconds);
        const windowRemaining = row.activeSession ? Math.max(0, Math.floor((row.activeSession.endsAtMs - nowMs) / 1000)) : 0;

        if (refs.remainingEl) {
          refs.remainingEl.textContent = fmtDuration(remainingSeconds);
          refs.remainingEl.className = remainingSeconds === 0 ? 'danger' : 'ok';
        }

        if (refs.windowRemainingEl) {
          refs.windowRemainingEl.textContent = fmtDuration(windowRemaining);
          refs.windowRemainingEl.className = windowRemaining === 0 ? 'muted' : 'warning';
        }

        if (refs.requestBtn) {
          refs.requestBtn.disabled = !canRequestNow(row, dynamicUsedSeconds, nowMs);
        }

        if (refs.disableBtn) {
          refs.disableBtn.disabled = !(row.activeSession && windowRemaining > 0);
        }
      }
    }

    async function fetchState(showMessage = false, lockReloadButton = false) {
      if (isStateFetchInFlight) {
        return;
      }

      const fetchSeq = ++stateFetchSeq;
      isStateFetchInFlight = true;

      try {
        if (lockReloadButton) {
          reloadBtn.disabled = true;
        }
        const response = await fetch('/api/state', { method: 'GET', cache: 'no-store' });
        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.error || `HTTP ${response.status}`);
        }

        if (fetchSeq < latestAppliedStateFetchSeq) {
          return;
        }
        latestAppliedStateFetchSeq = fetchSeq;
        applyState(payload);

        if (showMessage) {
          setStatus('Состояние обновлено.');
        }
      } catch (error) {
        setStatus(`Ошибка загрузки состояния: ${error.message}`, true);
      } finally {
        isStateFetchInFlight = false;
        if (lockReloadButton) {
          reloadBtn.disabled = false;
        }
      }
    }

    async function actionRequest(userName) {
      const minutes = Number(selectedWindows[userName]);
      if (!Number.isFinite(minutes) || minutes <= 0) {
        setStatus('Размер окна должен быть больше 0 минут.', true);
        return;
      }

      try {
        const currentRow = state && Array.isArray(state.users)
          ? state.users.find((row) => row.name === userName)
          : null;
        const operationLabel = currentRow && currentRow.activeSession
          ? 'Изменение текущей сессии'
          : 'Запрос доступа';
        setStatus(`${operationLabel} для ${userName}...`);
        const response = await fetch(`/api/users/${encodeURIComponent(userName)}/request`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ windowMinutes: minutes })
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.error || `HTTP ${response.status}`);
        }

        applyState(payload.state, true);
        setStatus(`Параметры доступа для ${userName} обновлены.`);
      } catch (error) {
        setStatus(`Ошибка изменения доступа для ${userName}: ${error.message}`, true);
      }
    }

    async function actionDisable(userName) {
      try {
        setStatus(`Отключение доступа для ${userName}...`);
        const response = await fetch(`/api/users/${encodeURIComponent(userName)}/disable`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.error || `HTTP ${response.status}`);
        }

        applyState(payload.state, true);
        setStatus(`Доступ для ${userName} отключен.`);
      } catch (error) {
        setStatus(`Ошибка отключения для ${userName}: ${error.message}`, true);
      }
    }

    rowsEl.addEventListener('input', (event) => {
      const input = event.target;
      if (!(input instanceof HTMLInputElement) || input.dataset.role !== 'window') {
        return;
      }

      const user = input.dataset.user;
      const max = Number(input.max || 0);
      let value = Number(input.value);

      if (!Number.isFinite(value)) {
        value = 0;
      }

      value = Math.floor(Math.max(0, Math.min(max, value)));
      selectedWindows[user] = value;
      input.value = String(value);
    });

    rowsEl.addEventListener('click', async (event) => {
      const button = event.target;
      if (!(button instanceof HTMLButtonElement)) {
        return;
      }

      const role = button.dataset.role;
      const user = button.dataset.user;
      if (!role || !user) {
        return;
      }

      if (role === 'request') {
        await actionRequest(user);
      } else if (role === 'disable') {
        await actionDisable(user);
      }
    });

    reloadBtn.addEventListener('click', () => fetchState(true, true));

    setInterval(() => {
      updateLiveRows();
    }, 1000);

    setInterval(() => {
      fetchState(false);
    }, 5000);

    fetchState(true);
  </script>
</body>
</html>
