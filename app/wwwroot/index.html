<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kid Control Access Manager</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --line: #dde4ef;
      --text: #1d2a3a;
      --muted: #5a6a80;
      --good: #1a8b4a;
      --warn: #b06800;
      --danger: #b02828;
      --primary: #1d5eff;
      --primary-hover: #1346c2;
      --disabled: #bcc6d6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: linear-gradient(145deg, #eef3ff 0%, #f7f9fd 55%, #eef7f1 100%);
      min-height: 100vh;
    }

    .container {
      max-width: 1280px;
      margin: 16px auto;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(17, 31, 60, 0.08);
    }

    h1 {
      margin: 0 0 12px 0;
      font-size: 1.4rem;
    }

    .meta {
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 0.95rem;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
      background: var(--primary);
      min-width: 130px;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:disabled {
      background: var(--disabled);
      cursor: not-allowed;
    }

    .btn-danger {
      background: var(--danger);
      min-width: 100px;
    }

    .btn-danger:hover {
      background: #8c2121;
    }

    .status {
      min-height: 24px;
      color: var(--muted);
      margin: 6px 0 12px;
    }

    .status.error {
      color: var(--danger);
      font-weight: 600;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
      background: #fff;
    }

    th,
    td {
      text-align: left;
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
      vertical-align: middle;
      font-size: 14px;
    }

    th {
      background: #f0f4fb;
      color: #33435b;
      font-weight: 700;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .user {
      font-weight: 700;
    }

    .user-link {
      color: var(--primary);
      text-decoration: none;
      border-bottom: 1px dashed rgba(29, 94, 255, 0.4);
    }

    .user-link:hover {
      color: var(--primary-hover);
      border-bottom-color: rgba(19, 70, 194, 0.6);
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .ok {
      color: var(--good);
      font-weight: 700;
    }

    .warning {
      color: var(--warn);
      font-weight: 700;
    }

    .danger {
      color: var(--danger);
      font-weight: 700;
    }

    .window-control {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    input[type='number'] {
      width: 88px;
      border: 1px solid #bfcbe0;
      border-radius: 6px;
      padding: 6px;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    td[data-label="Пользователь"] {
      min-width: 210px;
    }

    @media (max-width: 860px) {
      .container {
        margin: 8px;
        padding: 10px;
      }

      h1 {
        font-size: 1.15rem;
      }

      .toolbar button {
        width: 100%;
      }
    }

    @media (max-width: 760px) {
      .table-wrap {
        overflow-x: visible;
        border: none;
      }

      table,
      thead,
      tbody,
      tr,
      td {
        display: block;
        width: 100%;
      }

      thead {
        display: none;
      }

      table {
        min-width: 0;
      }

      tr {
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 10px;
        padding: 4px 10px;
        background: #fff;
      }

      tr:last-child {
        margin-bottom: 0;
      }

      td {
        border-bottom: 1px dashed #d9e1ee;
        padding: 10px 0;
      }

      td:last-child {
        border-bottom: none;
      }

      td::before {
        content: attr(data-label);
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .window-control {
        justify-content: space-between;
      }

      .actions {
        flex-direction: column;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Управление доступом MikroTik Kid Control</h1>
    <div class="meta" id="meta"></div>

    <div class="toolbar">
      <button id="reloadBtn" type="button">Обновить</button>
      <span class="muted">Кнопка "Запросить/продлить" активна до достижения дневного лимита.</span>
    </div>

    <div class="status" id="status"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Пользователь</th>
            <th>Лимит на сегодня</th>
            <th>Остаток до лимита</th>
            <th>Таймер текущего окна</th>
            <th>Размер окна (мин)</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script>
    let state = null;
    let syncTimestampMs = 0;
    let clientSyncAtMs = 0;
    const selectedWindows = {};

    const rowsEl = document.getElementById('rows');
    const statusEl = document.getElementById('status');
    const metaEl = document.getElementById('meta');
    const reloadBtn = document.getElementById('reloadBtn');

    function setStatus(message, isError = false) {
      statusEl.textContent = message || '';
      statusEl.classList.toggle('error', Boolean(isError));
    }

    function fmtDuration(totalSeconds) {
      const sec = Math.max(0, Math.floor(totalSeconds));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function currentServerMs() {
      if (!syncTimestampMs || !clientSyncAtMs) {
        return Date.now();
      }
      const delta = Date.now() - clientSyncAtMs;
      return syncTimestampMs + delta;
    }

    function renderMeta() {
      if (!state) {
        metaEl.innerHTML = '';
        return;
      }
      metaEl.innerHTML = [
        `День: <strong>${state.dayLabel}</strong>`,
        `Таймзона: <strong>${state.timezone}</strong>`,
        `Окно по умолчанию: <strong>${state.defaultWindowMinutes} мин</strong>`,
        `Grace: <strong>${state.graceMinutes} мин</strong>`
      ].map((item) => `<span>${item}</span>`).join('');
    }

    function getDynamicUsage(row, nowMs) {
      if (!row.activeSession) {
        return row.usedSeconds;
      }

      if (nowMs <= syncTimestampMs) {
        return row.usedSeconds;
      }

      const additional = Math.max(0, Math.min(nowMs, row.activeSession.endsAtMs) - syncTimestampMs);
      return row.usedSeconds + Math.floor(additional / 1000);
    }

    function renderRows() {
      rowsEl.innerHTML = '';

      if (!state || !Array.isArray(state.users) || state.users.length === 0) {
        rowsEl.innerHTML = '<tr><td colspan="6">В конфиге нет пользователей для отображения.</td></tr>';
        return;
      }

      const nowMs = currentServerMs();

      for (const row of state.users) {
        const tr = document.createElement('tr');
        const dayLimitSeconds = row.dayLimitMinutes * 60;
        const dynamicUsedSeconds = getDynamicUsage(row, nowMs);
        const remainingSeconds = Math.max(0, dayLimitSeconds - dynamicUsedSeconds);
        const windowRemaining = row.activeSession ? Math.max(0, Math.floor((row.activeSession.endsAtMs - nowMs) / 1000)) : 0;

        if (!(row.name in selectedWindows)) {
          selectedWindows[row.name] = row.suggestedWindowMinutes;
        }

        const maxWindow = Math.max(0, row.dayLimitMinutes);
        let selectedWindow = Number(selectedWindows[row.name]);
        if (!Number.isFinite(selectedWindow)) {
          selectedWindow = row.suggestedWindowMinutes;
        }
        selectedWindow = Math.max(0, Math.min(maxWindow, Math.floor(selectedWindow)));
        selectedWindows[row.name] = selectedWindow;

        const canRequestNow = row.existsInMikrotik && dynamicUsedSeconds < dayLimitSeconds;
        const requestLabel = row.activeSession ? 'Запросить/продлить доступ' : 'Запросить/продлить доступ';

        const userStatus = !row.existsInMikrotik
          ? '<span class="danger">нет в MikroTik</span>'
          : (row.mikrotikDisabled ? '<span class="warning">отключен</span>' : '<span class="ok">активен</span>');

        tr.innerHTML = `
          <td data-label="Пользователь">
            <div class="user"><a class="user-link" href="/user-stats.html?user=${encodeURIComponent(row.name)}">${row.displayName}</a></div>
            <div class="muted">${row.name} | ${userStatus}</div>
          </td>
          <td data-label="Лимит на сегодня">${fmtDuration(dayLimitSeconds)}</td>
          <td data-label="Остаток до лимита" class="${remainingSeconds === 0 ? 'danger' : 'ok'}">${fmtDuration(remainingSeconds)}</td>
          <td data-label="Таймер текущего окна" class="${windowRemaining === 0 ? 'muted' : 'warning'}">${fmtDuration(windowRemaining)}</td>
          <td data-label="Размер окна (мин)">
            <div class="window-control">
              <input
                type="number"
                min="0"
                max="${maxWindow}"
                step="1"
                value="${selectedWindow}"
                data-role="window"
                data-user="${row.name}"
              />
              <span class="muted">0..${maxWindow}</span>
            </div>
          </td>
          <td data-label="Действия">
            <div class="actions">
              <button type="button" data-role="request" data-user="${row.name}" ${canRequestNow ? '' : 'disabled'}>${requestLabel}</button>
              <button type="button" class="btn-danger" data-role="disable" data-user="${row.name}" ${row.existsInMikrotik ? '' : 'disabled'}>Отключить</button>
            </div>
          </td>
        `;

        rowsEl.appendChild(tr);
      }
    }

    async function fetchState(showMessage = false) {
      try {
        reloadBtn.disabled = true;
        const response = await fetch('/api/state', { method: 'GET' });
        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.error || `HTTP ${response.status}`);
        }

        state = payload;
        syncTimestampMs = payload.serverTimeMs;
        clientSyncAtMs = Date.now();
        renderMeta();
        renderRows();

        if (showMessage) {
          setStatus('Состояние обновлено.');
        }
      } catch (error) {
        setStatus(`Ошибка загрузки состояния: ${error.message}`, true);
      } finally {
        reloadBtn.disabled = false;
      }
    }

    async function actionRequest(userName) {
      const minutes = Number(selectedWindows[userName]);
      if (!Number.isFinite(minutes) || minutes <= 0) {
        setStatus('Размер окна должен быть больше 0 минут.', true);
        return;
      }

      try {
        setStatus(`Запрос доступа для ${userName}...`);
        const response = await fetch(`/api/users/${encodeURIComponent(userName)}/request`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ windowMinutes: minutes })
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.error || `HTTP ${response.status}`);
        }

        state = payload.state;
        syncTimestampMs = state.serverTimeMs;
        clientSyncAtMs = Date.now();
        renderMeta();
        renderRows();
        setStatus(`Доступ для ${userName} обновлен.`);
      } catch (error) {
        setStatus(`Ошибка запроса доступа для ${userName}: ${error.message}`, true);
      }
    }

    async function actionDisable(userName) {
      try {
        setStatus(`Отключение доступа для ${userName}...`);
        const response = await fetch(`/api/users/${encodeURIComponent(userName)}/disable`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.error || `HTTP ${response.status}`);
        }

        state = payload.state;
        syncTimestampMs = state.serverTimeMs;
        clientSyncAtMs = Date.now();
        renderMeta();
        renderRows();
        setStatus(`Доступ для ${userName} отключен.`);
      } catch (error) {
        setStatus(`Ошибка отключения для ${userName}: ${error.message}`, true);
      }
    }

    rowsEl.addEventListener('input', (event) => {
      const input = event.target;
      if (!(input instanceof HTMLInputElement) || input.dataset.role !== 'window') {
        return;
      }

      const user = input.dataset.user;
      const max = Number(input.max || 0);
      let value = Number(input.value);

      if (!Number.isFinite(value)) {
        value = 0;
      }

      value = Math.floor(Math.max(0, Math.min(max, value)));
      selectedWindows[user] = value;
      input.value = String(value);
    });

    rowsEl.addEventListener('click', async (event) => {
      const button = event.target;
      if (!(button instanceof HTMLButtonElement)) {
        return;
      }

      const role = button.dataset.role;
      const user = button.dataset.user;
      if (!role || !user) {
        return;
      }

      if (role === 'request') {
        await actionRequest(user);
      } else if (role === 'disable') {
        await actionDisable(user);
      }
    });

    reloadBtn.addEventListener('click', () => fetchState(true));

    setInterval(() => {
      if (state) {
        renderRows();
      }
    }, 1000);

    setInterval(() => {
      fetchState(false);
    }, 5000);

    fetchState(true);
  </script>
</body>
</html>
