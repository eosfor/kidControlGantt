<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Статистика пользователя</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vega-tooltip@0.35.2/build/vega-tooltip.min.css" />
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --line: #dde4ef;
      --text: #1d2a3a;
      --muted: #5a6a80;
      --primary: #1d5eff;
      --primary-hover: #1346c2;
      --auto: #1a8b4a;
      --manual: #bf3c3c;
      --active: #1f6fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: linear-gradient(145deg, #eef3ff 0%, #f7f9fd 55%, #eef7f1 100%);
      min-height: 100vh;
    }

    .container {
      max-width: 1280px;
      margin: 16px auto;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(17, 31, 60, 0.08);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
      background: var(--primary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .meta {
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 14px;
    }

    .status {
      min-height: 22px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .status.error {
      color: #bf3c3c;
      font-weight: 700;
    }

    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    .axis {
      display: none;
      margin-left: 155px;
      margin-right: 8px;
      position: relative;
      height: 24px;
      border-bottom: 1px solid var(--line);
    }

    .axis-mark {
      position: absolute;
      bottom: 0;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .chart {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: auto;
      background: #fff;
    }

    .chart > .vega-host {
      min-width: 100%;
      padding: 6px;
    }

    .row {
      display: grid;
      grid-template-columns: 155px 1fr;
      border-bottom: 1px solid var(--line);
      min-height: 40px;
    }

    .row:last-child {
      border-bottom: none;
    }

    .day-label {
      padding: 10px;
      color: #3a4b64;
      font-size: 13px;
      border-right: 1px solid var(--line);
      background: #f7f9fd;
      white-space: nowrap;
    }

    .timeline {
      position: relative;
      margin: 8px;
      border: 1px solid #e2e8f4;
      border-radius: 6px;
      background:
        repeating-linear-gradient(
          to right,
          transparent,
          transparent calc((100% / 24) - 1px),
          rgba(130, 150, 180, 0.12) calc((100% / 24) - 1px),
          rgba(130, 150, 180, 0.12) calc(100% / 24)
        ),
        #fafdff;
      min-height: 24px;
      overflow: hidden;
    }

    .segment {
      position: absolute;
      top: 2px;
      bottom: 2px;
      border-radius: 4px;
      min-width: 2px;
    }

    .segment.auto,
    .segment.expired {
      background: rgba(26, 139, 74, 0.78);
      border: 1px solid #1f6f45;
    }

    .segment.manual {
      background: rgba(191, 60, 60, 0.78);
      border: 1px solid #8b2f2f;
    }

    .segment.active {
      background: rgba(31, 111, 255, 0.78);
      border: 1px solid #1f5fd4;
    }

    .empty {
      color: var(--muted);
      font-size: 13px;
      padding: 12px;
      text-align: center;
    }

    .audit-section {
      margin-top: 14px;
    }

    .audit-title {
      margin: 0 0 8px 0;
      font-size: 1.05rem;
    }

    .audit-wrap {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow-x: auto;
      background: #fff;
    }

    .audit-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 740px;
    }

    .audit-table th,
    .audit-table td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      vertical-align: top;
    }

    .audit-table th {
      background: #f0f4fb;
      color: #33435b;
      font-weight: 700;
      white-space: nowrap;
    }

    .audit-table tbody tr:last-child td {
      border-bottom: none;
    }

    @media (max-width: 860px) {
      .container {
        margin: 8px;
        padding: 10px;
      }

      .axis {
        margin-left: 120px;
      }

      .row {
        grid-template-columns: 120px 1fr;
      }

      .day-label {
        font-size: 12px;
      }

      .audit-table {
        min-width: 660px;
      }
    }

    @media (max-width: 620px) {
      .legend {
        gap: 10px;
        font-size: 12px;
      }

      .axis {
        margin-left: 94px;
        height: 22px;
      }

      .row {
        grid-template-columns: 94px 1fr;
        min-height: 34px;
      }

      .day-label {
        padding: 8px 6px;
        font-size: 11px;
      }

      .timeline {
        margin: 6px;
        min-height: 22px;
      }
    }

    @media (max-width: 430px) {
      .top .btn {
        width: 100%;
      }

      .axis {
        display: none;
      }

      .row {
        grid-template-columns: 1fr;
      }

      .day-label {
        border-right: none;
        border-bottom: 1px solid var(--line);
        padding: 8px 10px 6px;
        font-size: 12px;
      }

      .timeline {
        margin: 6px 10px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <h1 id="title">Статистика пользователя</h1>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <a class="btn" href="/">Назад</a>
        <button class="btn" id="reloadBtn" type="button">Обновить</button>
      </div>
    </div>

    <div class="meta" id="meta"></div>
    <div class="status" id="status"></div>

    <div class="legend">
      <span class="legend-item"><span class="swatch" style="background:var(--auto);"></span> Истекло автоматически</span>
      <span class="legend-item"><span class="swatch" style="background:var(--manual);"></span> Отключено кнопкой</span>
      <span class="legend-item"><span class="swatch" style="background:var(--active);"></span> Активная сессия</span>
    </div>

    <div class="axis" id="axis"></div>
    <div class="chart" id="chart"></div>

    <div class="audit-section">
      <h2 class="audit-title">Журнал событий</h2>
      <div class="audit-wrap">
        <table class="audit-table">
          <thead>
            <tr>
              <th>Время</th>
              <th>Событие</th>
              <th>Запрошено</th>
              <th>Выдано</th>
              <th>До</th>
              <th>Сессия</th>
              <th>Детали</th>
            </tr>
          </thead>
          <tbody id="auditRows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <script>
    const DAY_MS = 24 * 60 * 60 * 1000;
    const DAYS = 7;

    const titleEl = document.getElementById('title');
    const metaEl = document.getElementById('meta');
    const statusEl = document.getElementById('status');
    const chartEl = document.getElementById('chart');
    const axisEl = document.getElementById('axis');
    const auditRowsEl = document.getElementById('auditRows');
    const reloadBtn = document.getElementById('reloadBtn');

    let stats = null;

    function setStatus(message, isError = false) {
      statusEl.textContent = message || '';
      statusEl.classList.toggle('error', Boolean(isError));
    }

    function getUserName() {
      const params = new URLSearchParams(window.location.search);
      return (params.get('user') || '').trim();
    }

    function buildAxis() {
      axisEl.innerHTML = '';
    }

    function fmtDate(ts, timeZone, opts) {
      return new Intl.DateTimeFormat('ru-RU', { timeZone, ...opts }).format(new Date(ts));
    }

    function fmtDateTime(ts, timeZone) {
      return fmtDate(ts, timeZone, {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });
    }

    function fmtTooltip(segment, timeZone) {
      const start = fmtDate(segment.startedAtMs, timeZone, {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });

      const end = fmtDate(segment.endedAtMs, timeZone, {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });

      return `${start} - ${end} | ${segment.endReasonLabel}`;
    }

    function fmtTime(ts, timeZone) {
      return fmtDate(ts, timeZone, {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });
    }

    function fmtDurationMs(durationMs) {
      const totalSeconds = Math.max(0, Math.floor((Number(durationMs) || 0) / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function buildChartRows(data) {
      const segments = Array.isArray(data.segments) ? data.segments : [];
      const rangeStart = data.rangeStartMs;
      const rangeEnd = data.rangeEndMs;
      const rowsCount = Math.max(1, Math.round((rangeEnd - rangeStart) / DAY_MS));
      const rows = [];

      for (let i = 0; i < rowsCount; i += 1) {
        const dayStart = rangeStart + (i * DAY_MS);
        const dayEnd = dayStart + DAY_MS;
        const dayRows = [];
        let dayTotalMs = 0;
        const baseDayLabel = fmtDate(dayStart, data.timezone, {
          weekday: 'short',
          day: '2-digit',
          month: '2-digit'
        });

        const daySegments = segments.filter((segment) => segment.endedAtMs > dayStart && segment.startedAtMs < dayEnd);
        daySegments.sort((a, b) => (a.startedAtMs - b.startedAtMs) || (a.endedAtMs - b.endedAtMs) || (a.id - b.id));

        for (let taskIndex = 0; taskIndex < daySegments.length; taskIndex += 1) {
          const segment = daySegments[taskIndex];
          const start = Math.max(segment.startedAtMs, dayStart);
          const end = Math.min(segment.endedAtMs, dayEnd);
          const widthMs = Math.max(0, end - start);
          if (widthMs <= 0) {
            continue;
          }
          dayTotalMs += widthMs;

          const startMinute = Math.max(0, (start - dayStart) / 60000);
          const endMinute = Math.min(24 * 60, (end - dayStart) / 60000);
          const startLabel = fmtTime(start, data.timezone);
          const endLabel = fmtTime(end, data.timezone);

          dayRows.push({
            dayKey: dayStart,
            dayLabel: baseDayLabel,
            lane: 'all',
            windowLabel: `${startLabel} - ${endLabel}`,
            startMinute,
            endMinute,
            endReason: segment.endReason || 'expired',
            endReasonLabel: segment.endReasonLabel || '-',
            sessionId: Number.isFinite(segment.sessionId) ? segment.sessionId : 0,
            actualSessionDuration: fmtDurationMs(
              Number.isFinite(segment.actualDurationMs)
                ? segment.actualDurationMs
                : Math.max(0, (segment.endedAtMs || 0) - (segment.startedAtMs || 0))
            ),
            windowTotalDuration: fmtDurationMs(
              Number.isFinite(segment.windowDurationMs)
                ? segment.windowDurationMs
                : Math.max(0, (segment.endedAtMs || 0) - (segment.startedAtMs || 0))
            ),
            tooltipRange: fmtTooltip({
              startedAtMs: start,
              endedAtMs: end,
              endReasonLabel: segment.endReasonLabel || '-'
            }, data.timezone)
          });
        }

        const dayLabel = `${baseDayLabel} · Итого: ${fmtDurationMs(dayTotalMs)}`;
        for (const row of dayRows) {
          rows.push({
            ...row,
            dayLabel
          });
        }
      }

      return rows;
    }

    function minuteTickValues() {
      return window.innerWidth <= 620
        ? [0, 360, 720, 1080, 1440]
        : [0, 240, 480, 720, 960, 1200, 1440];
    }

    function buildVegaSpec(rows, chartWidth) {
      return {
        $schema: 'https://vega.github.io/schema/vega-lite/v5.json',
        background: null,
        autosize: { type: 'pad', contains: 'padding' },
        spacing: 8,
        data: { values: rows },
        facet: {
          row: {
            field: 'dayLabel',
            type: 'ordinal',
            sort: { field: 'dayKey', op: 'min', order: 'ascending' },
            header: {
              title: null,
              labelFontSize: 12,
              labelColor: '#3a4b64',
              labelFontWeight: 600,
              labelPadding: 8,
              labelOrient: 'left',
              labelAngle: 0
            }
          }
        },
        spec: {
          width: chartWidth,
          height: 34,
          encoding: {
            y: {
              field: 'lane',
              type: 'ordinal',
              axis: null
            },
            x: {
              field: 'startMinute',
              type: 'quantitative',
              scale: { domain: [0, 1440], nice: false },
              axis: {
                title: null,
                values: minuteTickValues(),
                grid: true,
                tickColor: '#d7e0ee',
                gridColor: '#e8eef7',
                labelColor: '#5a6a80',
                labelFontSize: 11,
                labelExpr: "datum.value >= 1440 ? '23:59' : ((floor(datum.value/60) < 10 ? '0' : '') + floor(datum.value/60) + ':' + ((datum.value % 60) < 10 ? '0' : '') + (datum.value % 60))"
              }
            },
          },
          layer: [
            {
              encoding: {
                x2: { field: 'endMinute' },
                color: {
                  field: 'endReason',
                  type: 'nominal',
                  legend: null,
                  scale: {
                    domain: ['expired', 'auto', 'manual', 'active'],
                    range: ['#1a8b4a', '#1a8b4a', '#bf3c3c', '#1f6fff']
                  }
                },
                tooltip: [
                  { field: 'dayLabel', type: 'nominal', title: 'Дата' },
                  { field: 'windowLabel', type: 'nominal', title: 'Окно' },
                  { field: 'actualSessionDuration', type: 'nominal', title: 'Реальная длительность сессии' },
                  { field: 'windowTotalDuration', type: 'nominal', title: 'Суммарный размер окна' },
                  { field: 'endReasonLabel', type: 'nominal', title: 'Статус' },
                  { field: 'sessionId', type: 'quantitative', title: 'Сессия' },
                  { field: 'tooltipRange', type: 'nominal', title: 'Подробно' }
                ]
              },
              mark: {
                type: 'bar',
                cornerRadius: 4,
                height: 14,
                stroke: '#ffffff',
                strokeWidth: 0.8
              }
            }
          ]
        },
        resolve: {
          scale: { y: 'independent' }
        },
        config: {
          view: { stroke: '#dde4ef', fill: '#fafdff' },
          axis: { domainColor: '#dde4ef' },
          facet: { spacing: 6 }
        }
      };
    }

    function getChartPlotWidth() {
      const containerWidth = Math.max(320, Math.floor(chartEl.clientWidth || 0));
      const leftColumnsWidth = window.innerWidth <= 620 ? 170 : 240;
      if (window.innerWidth <= 620) {
        return Math.max(360, containerWidth - leftColumnsWidth - 24);
      }
      return Math.max(520, containerWidth - leftColumnsWidth - 28);
    }

    async function renderChart(data) {
      chartEl.innerHTML = '';
      const rows = buildChartRows(data);

      if (rows.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'За выбранный период сессий не найдено.';
        chartEl.appendChild(empty);
        return;
      }

      if (typeof vegaEmbed !== 'function') {
        throw new Error('Не удалось загрузить Vega-Lite (vega-embed).');
      }

      const host = document.createElement('div');
      host.className = 'vega-host';
      chartEl.appendChild(host);

      await vegaEmbed(host, buildVegaSpec(rows, getChartPlotWidth()), {
        actions: false,
        renderer: 'svg'
      });
    }

    function renderMeta(data) {
      metaEl.innerHTML = [
        `Пользователь: <strong>${data.displayName}</strong> (${data.user})`,
        `Период: <strong>последние ${data.days} дней</strong>`,
        `Таймзона: <strong>${data.timezone}</strong>`
      ].map((item) => `<span>${item}</span>`).join('');
    }

    function fmtMinutes(value) {
      if (!Number.isFinite(value)) {
        return '-';
      }
      return `${value} мин`;
    }

    function renderAudit(data) {
      auditRowsEl.innerHTML = '';
      const events = Array.isArray(data.auditEvents) ? data.auditEvents : [];

      if (events.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 7;
        td.className = 'empty';
        td.textContent = 'Событий за выбранный период нет.';
        tr.appendChild(td);
        auditRowsEl.appendChild(tr);
        return;
      }

      for (const event of events) {
        const tr = document.createElement('tr');

        const occurredAt = document.createElement('td');
        occurredAt.textContent = fmtDateTime(event.occurredAtMs, data.timezone);

        const action = document.createElement('td');
        action.textContent = event.actionLabel || event.action || '-';

        const requested = document.createElement('td');
        requested.textContent = fmtMinutes(event.requestedWindowMinutes);

        const granted = document.createElement('td');
        granted.textContent = fmtMinutes(event.grantedWindowMinutes);

        const grantedUntil = document.createElement('td');
        grantedUntil.textContent = Number.isFinite(event.grantedUntilMs)
          ? fmtDateTime(event.grantedUntilMs, data.timezone)
          : '-';

        const session = document.createElement('td');
        session.textContent = Number.isFinite(event.sessionId) && event.sessionId > 0
          ? `#${event.sessionId}`
          : '-';

        const details = document.createElement('td');
        details.textContent = event.detailsLabel || event.details || '-';

        tr.appendChild(occurredAt);
        tr.appendChild(action);
        tr.appendChild(requested);
        tr.appendChild(granted);
        tr.appendChild(grantedUntil);
        tr.appendChild(session);
        tr.appendChild(details);
        auditRowsEl.appendChild(tr);
      }
    }

    async function loadStats(showMessage = false) {
      const user = getUserName();
      if (!user) {
        setStatus('Не указан пользователь в query-параметре user.', true);
        return;
      }

      try {
        reloadBtn.disabled = true;
        const response = await fetch(`/api/users/${encodeURIComponent(user)}/stats?days=${DAYS}`, { method: 'GET' });
        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.error || `HTTP ${response.status}`);
        }

        stats = payload;
        titleEl.textContent = `Статистика: ${payload.displayName}`;
        renderMeta(payload);
        await renderChart(payload);
        renderAudit(payload);

        if (showMessage) {
          setStatus('Статистика обновлена.');
        }
      } catch (error) {
        setStatus(`Ошибка загрузки статистики: ${error.message}`, true);
      } finally {
        reloadBtn.disabled = false;
      }
    }

    reloadBtn.addEventListener('click', () => loadStats(true));
    window.addEventListener('resize', () => {
      buildAxis();
      if (stats) {
        renderChart(stats).catch((error) => {
          setStatus(`Ошибка отрисовки графика: ${error.message}`, true);
        });
      }
    });

    buildAxis();
    loadStats(true);

    setInterval(() => {
      if (stats) {
        loadStats(false);
      }
    }, 15000);
  </script>
</body>
</html>
